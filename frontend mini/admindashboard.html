<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="dashboard">

    <div class="sidebar">
        <h2>Admin</h2>
        <ul>
            <li><i class="fas fa-chart-line"></i> Dashboard</li>
            <li><i class="fas fa-building"></i> Departments</li>
            <li><i class="fas fa-users"></i> Users</li>
            <li><i class="fas fa-poll"></i> Polls</li>
            <li><i class="fas fa-chart-pie"></i> Reports</li>
            <li onclick="location.href='login.html'"><i class="fas fa-sign-out-alt"></i> Logout</li>
        </ul>
    </div>

    <div class="main-content">
        <h1>Admin Dashboard</h1>

        <div class="stats-grid">
            <div class="dash-card">
                <h3>12</h3>
                <p>Departments</p>
            </div>
            <div class="dash-card">
                <h3>350</h3>
                <p>Students</p>
            </div>
            <div class="dash-card">
                <h3>45</h3>
                <p>Active Polls</p>
            </div>
            <div class="dash-card">
                <h3>87%</h3>
                <p>Response Rate</p>
            </div>
        </div>

        <div class="recent">
            <h2>Recent Activity</h2>
            <ul>
                <li>New poll created for CSE Department</li>
                <li>Feedback submitted anonymously</li>
                <li>Report generated successfully</li>
            </ul>
        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
